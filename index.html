  }
  function isi(t) {

  }
  function mulai() { posisi = 0; antre = []; selesai = false; jeda = [false, false]; benar = [0, 0]; IG.tampil('layar-main'); tali(); isi(0); isi(1); }
  function jawab(t, teks, b) {
    if (selesai || jeda[t]) { return; }
    if (teks === soal[t].benar[0]) {

      if (Math.abs(posisi) >= N) { selesai = true; IG.hasil({ benar: benar[t], total: benar[0] + benar[1], skorTeks: NAMA[t] + ' menang!', pesanTeks: 'Jawaban benar: ' + NAMA[0] + ' ' + benar[0] + ', ' + NAMA[1] + ' ' + benar[1] + '.', ulas: [] }); return; }
      isi(t); return;
    }
    b.classList.add('salah'); jeda[t] = true; $('sisi-' + t).classList.add('jeda'); IG.umumkan(NAMA[t] + ' salah, tunggu 2 detik.');
    setTimeout(function () { jeda[t] = false; $('sisi-' + t).classList.remove('jeda'); if (!selesai) { isi(t); } }, 2000);
  }
  IG.siapkan(mulai);
})();
</script>
